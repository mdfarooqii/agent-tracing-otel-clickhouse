# Lab: restart the gateway with metrics from every span plus smart tail sampling.
#   docker compose -f compose.yaml -f docs/tutorial/labs/compose.smart-sampling.yaml up -d otel-gateway
# Turn it off again with:
#   docker compose up -d otel-gateway
# Paths are relative to the repo root (the first compose file's folder).

services:
  otel-gateway:
    command:
      - --config=/etc/otel-gateway-config.yaml
      - --config=/etc/otel-gateway-smart-sampling.yaml
    volumes:
      - ./docs/tutorial/labs/otel-gateway-smart-sampling.yaml:/etc/otel-gateway-smart-sampling.yaml:ro
