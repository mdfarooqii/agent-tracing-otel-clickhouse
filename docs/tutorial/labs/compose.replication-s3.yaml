# Lab: gives clickhouse-03 the S3 disk and "tiered" policy from module 11, so it
# can hold replicas of tables that use them. Needed only once S3 tiering is on
# (otel_traces then has storage_policy = 'tiered', which a server without the
# policy can't create). Use it together with the other two lab files:
#   docker compose -f compose.yaml -f docs/tutorial/labs/compose.s3-tiering.yaml \
#     -f docs/tutorial/labs/compose.replication.yaml \
#     -f docs/tutorial/labs/compose.replication-s3.yaml up -d clickhouse-03
# Paths are relative to the repo root (the first compose file's folder).

services:
  clickhouse-03:
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT_BASE:-http://seaweedfs:8333/traces}/clickhouse-03/
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-demo}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-demo}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./docs/tutorial/labs/storage-s3.xml:/etc/clickhouse-server/config.d/storage-s3.xml:ro
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
