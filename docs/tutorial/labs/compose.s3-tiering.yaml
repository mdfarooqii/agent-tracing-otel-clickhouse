# Lab: tiered storage for module 11. Adds a local S3 server (SeaweedFS) and
# gives both ClickHouse replicas an S3 disk and a "tiered" storage policy.
#   docker compose -f compose.yaml -f docs/tutorial/labs/compose.s3-tiering.yaml up -d
#   docs/tutorial/labs/enable-s3-tiering.sh
# Back to local-only storage: see "Turning it off" in docs/tutorial/11-s3-tiering.md.
# Paths are relative to the repo root (the first compose file's folder).
#
# For real S3, drop the seaweedfs services and set S3_ENDPOINT_BASE to
# https://<bucket>.s3.<region>.amazonaws.com/<prefix> plus real credentials;
# each replica appends its own /clickhouse-0N/ folder.

services:
  seaweedfs:
    image: ${REGISTRY:-docker.io}/chrislusf/seaweedfs:4.54
    container_name: seaweedfs
    hostname: seaweedfs
    command: ["server", "-s3", "-dir=/data", "-ip=seaweedfs", "-volume.max=0"]
    ports:
      - "8333:8333"   # S3 API
    volumes:
      - seaweedfs-data:/data
    networks:
      - agent-tracing
    restart: unless-stopped

  seaweedfs-init:
    image: ${REGISTRY:-docker.io}/chrislusf/seaweedfs:4.54
    container_name: seaweedfs-init
    entrypoint: ["sh", "-c"]
    command:
      - |
        until echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; do sleep 1; done
        echo "s3.bucket.create -name traces" | weed shell -master=seaweedfs:9333 || true
        echo "bucket traces ready"
    depends_on:
      - seaweedfs
    networks:
      - agent-tracing
    restart: "no"

  clickhouse-01:
    environment: &s3-env
      S3_ENDPOINT: ${S3_ENDPOINT_BASE:-http://seaweedfs:8333/traces}/clickhouse-01/
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-demo}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-demo}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./docs/tutorial/labs/storage-s3.xml:/etc/clickhouse-server/config.d/storage-s3.xml:ro
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully

  clickhouse-02:
    environment:
      <<: *s3-env
      S3_ENDPOINT: ${S3_ENDPOINT_BASE:-http://seaweedfs:8333/traces}/clickhouse-02/
    volumes:
      - ./docs/tutorial/labs/storage-s3.xml:/etc/clickhouse-server/config.d/storage-s3.xml:ro
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully

volumes:
  seaweedfs-data:
